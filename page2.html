<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Page</title>
    <link rel="stylesheet" href="output.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-blue-500 min-h-screen flex items-center justify-center relative">
    <!-- Back Button -->
    <div class="absolute top-4 left-4">
        <button class="flex items-center gap-2 bg-black text-white px-4 py-2 rounded-full hover:bg-gray-800">
            <span>◀</span> BACK
        </button>
    </div>

    <!-- Main Center Content -->
    <div class="text-center">
        <div class="relative mb-6">
            <!-- Green gradient circle -->
            <img src="Images/Ellipse 2.svg" alt="Background Circle" class="w-64 h-64 mx-auto">
            <!-- Logo -->
            <img src="Images/logo 1.svg" alt="Logo"
                class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-32 h-32">
        </div>
    </div>

    <!-- Bottom Left Text -->
    <p class="absolute bottom-4 left-4 text-white text-lg font-semibold">
        YOU SAID: BOOK AN APPOINTMENT FOR 4PM TODAY
    </p>
</body>

</html>
